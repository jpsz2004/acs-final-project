# docker-compose.yml — Historia 2
# ─────────────────────────────────────────────────────────────────────────────
# Servicios:
#   postgres  — base de datos PostgreSQL 16
#   api       — FastAPI + workers concurrentes
#   tests     — corre pytest contra la app en memoria (sin DB)
#
# Uso:
#   docker compose up                  # levanta postgres + api
#   docker compose run --rm tests      # corre los tests
#   docker compose down -v             # destruye contenedores y volúmenes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${PORT:-8002}:${PORT:-8002}"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Tests ───────────────────────────────────────────────────────────────────
  # Corre pytest en modo in-memory (sin DATABASE_URL).
  # No depende del servicio postgres ni corre migraciones.
  #
  # IMPORTANTE: sobreescribe SOLO el entrypoint para reemplazar completamente
  # el entrypoint.sh del Dockerfile. No usar 'command' junto con 'entrypoint'
  # porque Docker los concatena y produce un comando inválido.
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ""
    entrypoint: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]

volumes:
  postgres_data:
